[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "globalstash"
version = "0.1.0"
description = "Thread-safe, process-wide global state you can import from any module at any depth."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "mahrtayyab", email = "tayyabmahr@gmail.com" }]
keywords = ["global", "state", "flask.g", "config", "singleton", "thread-safe"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mahrtayyab/globalstash"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
globalstash = ["py.typed"]
